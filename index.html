<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maksadbek Advertising Agency</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#fbf8f3;--card:#fff;--tx:#17171c;--mu:#6f6b75;--bd:#e6e0d8;--o:#f77a1b;--c:#27a9e1;--b:#2c6cb8;--g:#6cc04a;--p:#e91e7a;--pu:#8e2490;--grad:linear-gradient(90deg,#f77a1b,#e91e7a,#8e2490,#2c6cb8,#27a9e1,#6cc04a);--hd:'Unbounded','Manrope',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121216;--card:#1c1c22;--tx:#f5f2ee;--mu:#a5a1ab;--bd:#34343c}}
:root[data-theme="dark"]{--bg:#121216;--card:#1c1c22;--tx:#f5f2ee;--mu:#a5a1ab;--bd:#34343c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:16px/1.55 'Manrope',system-ui,sans-serif;background:radial-gradient(500px 360px at 0 0,#f77a1b22,transparent),radial-gradient(520px 380px at 100% 12%,#e91e7a1f,transparent),radial-gradient(520px 400px at 8% 100%,#27a9e11f,transparent),radial-gradient(420px 320px at 100% 100%,#6cc04a22,transparent),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);box-shadow:0 6px 24px #0000000d}
.top::after{content:"";display:block;height:4px;background:var(--grad)}
.top .in{max-width:1000px;margin:auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font:800 22px/1 'Manrope',sans-serif;letter-spacing:1px}
.logo img{height:40px}
.logo small{display:block;font:600 9px 'Manrope',sans-serif;letter-spacing:3px;color:var(--mu);text-transform:uppercase;margin-top:4px}
nav{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:99px}
nav button{padding:8px 14px;border:0;background:transparent;color:var(--tx);border-radius:99px;font:700 13px 'Manrope',sans-serif;cursor:pointer}
nav button.on{background:var(--grad);color:#fff}
.hero .in{max-width:1000px;margin:auto;padding:34px 16px 22px;display:grid;gap:20px;grid-template-columns:1.15fr 1fr;align-items:center}
.tag{display:inline-block;padding:5px 12px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font:800 11px 'Manrope',sans-serif;letter-spacing:2px;text-transform:uppercase}
.hero h1{font-family:var(--hd);font-weight:800;font-size:clamp(30px,6.4vw,58px);line-height:1.05;margin:14px 0 12px}
.gr{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mu);max-width:44ch}
.art{position:relative;display:grid;place-items:center;min-height:220px}
.art::before{content:"";position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:conic-gradient(from 20deg,#f77a1b,#e91e7a,#8e2490,#2c6cb8,#27a9e1,#6cc04a,#f77a1b);filter:blur(46px);opacity:.38}
.art img{position:relative;width:min(100%,380px);animation:fl 5s ease-in-out infinite;filter:drop-shadow(0 18px 24px #0003)}
@keyframes fl{50%{transform:translateY(-10px) rotate(-1.5deg)}}
.tick{background:var(--grad);color:#fff;overflow:hidden;white-space:nowrap;margin:0 0 4px}
.tick div{display:inline-block;padding:9px 0;font:800 14px 'Manrope',sans-serif;letter-spacing:4px;animation:mq 30s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tick div,.art img{animation:none}}
main{max-width:1000px;margin:auto;padding:22px 16px 48px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px;position:relative;overflow:hidden;box-shadow:0 10px 30px #0000000d;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.card::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--c,var(--o))}
.card .no{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--c,var(--o));color:#fff;font:800 13px 'Manrope',sans-serif;margin-top:4px}
h2{font-family:var(--hd);font-weight:800;font-size:22px;line-height:1.15;margin:8px 0 6px}
.gal{display:flex;gap:8px;overflow-x:auto;margin:8px 0}.gal img{height:140px;border-radius:14px;display:block}
.ph{height:110px;border-radius:14px;margin:8px 0;display:grid;place-items:center;color:var(--mu);font-size:12px;background:repeating-linear-gradient(45deg,var(--bg) 0 10px,var(--bd) 10px 20px)}
.mu{color:var(--mu);font-size:13px}
label{display:block;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--c);box-shadow:0 0 0 3px #27a9e133}
textarea{min-height:70px}
.row{display:flex;gap:8px;align-items:center;margin-top:6px}.row>*{flex:1}.row>button{flex:0 0 auto}
.btn{padding:11px 20px;border:0;border-radius:99px;background:var(--grad);color:#fff;font:800 14px 'Manrope',sans-serif;cursor:pointer;margin-top:12px}
.btn.g{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}
.res{margin-top:16px;padding:16px;background:var(--bg);border:2px dashed var(--p);border-radius:16px}
.res .big{font:800 34px/1.1 var(--hd);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.login{max-width:380px;margin:20px auto}
.err{color:var(--p);font-weight:700;margin-top:8px}
.hide{display:none}
@media (max-width:700px){.hero .in{grid-template-columns:1fr}.art{min-height:170px}.art img{width:70%}}
input[type=checkbox]{width:auto}
.chk{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;color:var(--tx)}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;font:700 13px 'Manrope',sans-serif;cursor:pointer}.seg button.on{background:var(--grad);color:#fff;border-color:transparent}
.prt input{min-width:0;padding:10px 8px}.prt>input:first-child{flex:1.6}
nav{flex-wrap:wrap}
</style>
</head>
<body>
<div class="top"><div class="in">
<div class="logo"><img class="mk" alt=""><div>MAKSADBEK<small>Advertising Agency · since 2002</small></div></div>
<nav><button id="t0" class="on" onclick="tab(0)">Reklama</button><button id="t1" onclick="tab(1)">Poligrafiya</button><button id="t2" onclick="tab(2)">Kalkulyator</button><button id="t3" onclick="tab(3)">Admin</button></nav>
</div></div>
<div id="hero">
<div class="hero"><div class="in">
<div><span class="tag">Since 2002</span><h1>Reklamangiz <span class="gr">ko‘chada porlasin</span></h1><p>Tashqi reklama, UF pechat va poligrafiya. O‘lchamni kiriting, narxni darhol ko‘ring.</p><button class="btn" onclick="tab(2)">Narxni hisoblash →</button></div>
<div class="art"><img class="mk" alt="Maksadbek logotipi"></div>
</div></div>
<div class="tick"><div id="tk"></div></div>
</div>
<main>
<section id="p0"><div id="prods" class="grid"></div></section>
<section id="p1" class="hide"><div id="poly" class="grid"></div></section>
<section id="p2" class="hide"><div class="card" style="max-width:660px;margin:auto">
<h2>Kalkulyator</h2>
<label>Mahsulot</label><select id="cp" onchange="fillTypes()"></select>
<label>Turi / qalinligi</label><select id="ct"></select>
<label>Rejim</label><div class="seg"><button id="m1" class="on" onclick="setMode(1)">Butun (bitta o‘lcham)</button><button id="m2" onclick="setMode(2)">Bo‘lak-bo‘lak</button></div>
<div id="whole"><div class="row"><div><label>Eni (sm)</label><input id="cw" type="number" min="1" value="190"></div><div><label>Bo‘yi (sm)</label><input id="ch" type="number" min="1" value="500"></div></div></div>
<div id="parts" class="hide"><label>Bo‘laklar: nomi, eni, bo‘yi, soni</label><div id="pl"></div><button class="btn g" onclick="addPart()">+ Bo‘lak qo‘shish</button><div class="mu" style="margin-top:6px">Masalan: eshigi bor oynaning katta va kichik bo‘laklari. Tizim ularni rulonga eng tejamli joylashtiradi.</div></div>
<div id="rotBox"><label class="chk"><input type="checkbox" id="rot" checked> Bo‘laklarni burib joylashtirishga ruxsat</label></div>
<div id="dzc"></div>
<button class="btn" onclick="calc()">Hisoblash</button>
<div id="out" class="res hide"></div>
</div></section>
<section id="p3" class="hide"><div id="adm"></div></section>
</main>
<script>
var DEF=[
{name:"Banner",mode:"roll",rolls:[160,220,320],types:[{name:"340 g/m²",price:25000},{name:"440 g/m²",price:32000}]},
{name:"Orakal",mode:"roll",rolls:[100,126,152],types:[{name:"Oddiy",price:30000},{name:"Yorug‘lik qaytaruvchi",price:45000}]},
{name:"Setka",mode:"roll",rolls:[270,320],types:[{name:"Standart",price:28000}]},
{name:"Xolst",mode:"roll",rolls:[160],types:[{name:"Standart",price:60000}]},
{name:"Vatman",mode:"roll",rolls:[110],types:[{name:"Standart",price:20000}]},
{name:"Tent",mode:"roll",rolls:[200,250],types:[{name:"Standart",price:55000}]},
{name:"UF pechat",mode:"direct",rolls:[],types:[{name:"UF pechat",price:150000}]}
];
var PDEF=[
{name:"Vizitka",unit:"100 dona",options:[{name:"Oddiy karton",price:60000},{name:"Laminatsiyali",price:80000}]},
{name:"Buklet",unit:"100 dona",options:[{name:"A4 ikki bukli",price:250000},{name:"A4 uch bukli",price:300000}]},
{name:"Flayer",unit:"100 dona",options:[{name:"A6",price:70000},{name:"A5",price:120000}]},
{name:"Etiketka",unit:"100 dona",options:[{name:"Oddiy yelimli",price:90000}]},
{name:"Nakleyka",unit:"100 dona",options:[{name:"Kichik (5×5 sm)",price:80000},{name:"O‘rtacha (10×10 sm)",price:140000}]},
{name:"Albom",unit:"1 dona",options:[{name:"Oddiy albom",price:120000}]},
{name:"Hujjat uchun rasm",unit:"1 komplekt",options:[{name:"3×4",price:25000},{name:"4×6",price:30000}]},
{name:"Chashkaga rasm",unit:"1 dona",options:[{name:"Oq klassik chashka",price:45000},{name:"Rangli ichki chashka",price:55000},{name:"Sehrli (qora) chashka",price:70000},{name:"Termo chashka",price:90000}]}
];
var PD={"Vizitka":"Chiroyli va mustahkam vizitkalar, kerakli sonda.","Buklet":"Mahsulot va xizmatlaringizni tanishtiruvchi buklet.","Flayer":"Aksiya va e’lonlar uchun varaqalar.","Etiketka":"Mahsulotingiz uchun yelimli etiketkalar.","Nakleyka":"Har xil o‘lchamdagi stikerlar.","Albom":"Foto va taqdimot albomlari.","Hujjat uchun rasm":"Pasport va boshqa hujjatlar uchun foto.","Chashkaga rasm":"Sevimli rasm yoki logotip chashkaga tushiriladi. Chashka turini tanlang."};
var DSDEF={from:50000,info:"Dizayner buyurtmangiz uchun maket tayyorlaydi."};
var DESC={"Banner":"Tashqi reklama uchun eng ko‘p ishlatiladigan material: mustahkam, namga va quyoshga chidamli PVX mato.","Orakal":"Yelimli plyonka. Vitrina, shisha, avtomobil, yozuv va stikerlar uchun.","Setka":"Teshikli (to‘rsimon) banner. Shamol o‘tkazgani uchun bino fasadlari va to‘siqlar uchun qulay.","Xolst":"Rasm va portretlarni bosib chiqarish uchun gazlama asosli material.","Vatman":"Plakat, stend va ichki reklama uchun qalin qog‘oz.","Tent":"Chodir, soyabon va yopinchiq uchun mustahkam material.","UF pechat":"Qattiq yuzalarga to‘g‘ridan-to‘g‘ri bosma. Narx kv bo‘yicha hisoblanadi."};
var COL=["#f77a1b","#27a9e1","#6cc04a","#e91e7a","#2c6cb8","#8e2490"];
var D,P,DS,AUTH=false,MODE=1,PARTS=[{n:"Katta oyna",w:120,h:200,q:2},{n:"Kichik oyna",w:60,h:80,q:3},{n:"Eshik oynasi",w:80,h:190,q:1}];
function cp(x){return JSON.parse(JSON.stringify(x))}
(function(){var x=null;try{x=JSON.parse(localStorage.getItem("mk3"))}catch(e){}
if(x&&x.D){D=x.D;P=x.P;DS=x.DS}else{try{D=JSON.parse(localStorage.getItem("mk"))}catch(e){}
if(D&&D.length&&!D.some(function(p){return p.mode=="direct"}))D.push(cp(DEF[6]))}
if(!D||!D.length)D=cp(DEF);if(!P||!P.length)P=cp(PDEF);if(!DS)DS=cp(DSDEF)})();
try{AUTH=sessionStorage.getItem("mks")==="1"}catch(e){}
function norm(){D.forEach(function(p){if(!p.imgs)p.imgs=[];if(!p.mode)p.mode="roll";if(!p.rolls)p.rolls=[];if(p.desc==null)p.desc=DESC[p.name]||""});
P.forEach(function(p){if(!p.imgs)p.imgs=[];if(p.desc==null)p.desc=PD[p.name]||"";if(!p.unit)p.unit="1 dona"})}
norm();
function save(){try{localStorage.setItem("mk3",JSON.stringify({D:D,P:P,DS:DS}))}catch(e){alert("Xotira to‘ldi: rasmlar hajmi katta. Ba’zi rasmlarni o‘chiring.")}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function fmt(n){return Math.round(n).toLocaleString("ru-RU")}
function tab(n){["0","1","2","3"].forEach(function(i){$("p"+i).classList.toggle("hide",i!=n);$("t"+i).classList.toggle("on",i==n)});$("hero").classList.toggle("hide",n!=0);
if(n==3)gate();else if(n==2)fillProducts();else if(n==1)renderPoly();else renderProds();window.scrollTo(0,0)}
function ticker(){var s=D.concat(P).map(function(p){return esc(p.name).toUpperCase()}).join(" ★ ")+" ★ ";$("tk").innerHTML=s+s+s+s}
function dzCard(){return `<div class="card" style="grid-column:1/-1;--c:var(--p)"><h2>Dizayn xizmati</h2><p>${esc(DS.info)}</p><div class="mu">Tayyor dizayningiz bo‘lsa, o‘zingiz berasiz va dizayn narxi qo‘shilmaydi. Dizayner xizmatida narx ${fmt(DS.from)} so’mdan boshlanadi va yuqori chegarasi yo‘q: aniq narx har bir dizayn ko‘rinishiga qarab belgilanadi.</div></div>`}
function dzNote(){return `<div class="mu" style="margin-top:8px">+ Dizayn xizmati: ${fmt(DS.from)} so’mdan. Aniq narxni dizayn ko‘rinishiga qarab biz aytamiz.</div>`}
function dzSel(id){return `<label>Dizayn</label><select id="${id}"><option value="0">Tayyor dizaynim bor</option><option value="1">Dizayner xizmati kerak (${fmt(DS.from)} so’mdan)</option></select>`}
function gal(p){return p.imgs.length?`<div class="gal">${p.imgs.map(function(s){return `<img src="${s}" alt="">`}).join("")}</div>`:`<div class="ph">Rasm hali qo‘shilmagan</div>`}
function renderProds(){ticker();$("prods").innerHTML=dzCard()+D.map(function(p,i){
return `<div class="card" style="--c:${COL[i%6]}"><div class="no">${String(i+1).padStart(2,"0")}</div><h2>${esc(p.name)}</h2>${gal(p)}<p>${esc(p.desc)}</p><div class="mu">${p.types.map(function(t){return esc(t.name)+" — "+fmt(t.price)+" so’m/kv"}).join("<br>")}</div>`+(p.mode=="direct"?"":`<div class="mu" style="margin-top:6px">Rulon enlari: ${p.rolls.join(", ")} sm</div>`)+`<button class="btn" onclick="goCalc(${i})">Narxini hisoblash</button></div>`}).join("")}
function renderPoly(){$("poly").innerHTML=dzCard()+P.map(function(s,i){
return `<div class="card" style="--c:${COL[(i+3)%6]}"><div class="no">${String(i+1).padStart(2,"0")}</div><h2>${esc(s.name)}</h2>${gal(s)}<p>${esc(s.desc)}</p>
<label>Turi</label><select id="po${i}">${s.options.map(function(o,j){return `<option value="${j}">${esc(o.name)} — ${fmt(o.price)} so’m / ${esc(s.unit)}</option>`}).join("")}</select>
<label>Soni (birlik: ${esc(s.unit)})</label><input id="pq${i}" type="number" min="1" value="1">${dzSel("pd"+i)}
<button class="btn" onclick="calcPoly(${i})">Hisoblash</button><div id="pr${i}" class="res hide"></div></div>`}).join("")}
function calcPoly(i){var s=P[i],o=s.options[$("po"+i).value],q=+$("pq"+i).value,r=$("pr"+i);r.classList.remove("hide");
if(!o||!(q>0)){r.textContent="Turini tanlang va sonini kiriting.";return}
r.innerHTML=`<div class="mu">${esc(o.name)} · ${q} × ${esc(s.unit)}</div><div class="big">${fmt(o.price*q)} so’m</div>`+($("pd"+i).value=="1"?dzNote():"")}
function goCalc(i){tab(2);$("cp").value=i;fillTypes()}
function fillProducts(){var s=$("cp"),v=s.value;s.innerHTML=D.map(function(p,i){return `<option value="${i}">${esc(p.name)}</option>`}).join("");if(v&&D[v])s.value=v;$("dzc").innerHTML=dzSel("dz");renderParts();fillTypes()}
function fillTypes(){var p=D[$("cp").value];$("ct").innerHTML=p?p.types.map(function(t,i){return `<option value="${i}">${esc(t.name)} — ${fmt(t.price)} so’m/kv</option>`}).join(""):"";$("rotBox").classList.toggle("hide",!p||p.mode=="direct");$("out").classList.add("hide")}
function setMode(n){MODE=n;$("m1").classList.toggle("on",n==1);$("m2").classList.toggle("on",n==2);$("whole").classList.toggle("hide",n!=1);$("parts").classList.toggle("hide",n!=2);$("out").classList.add("hide")}
function renderParts(){$("pl").innerHTML=PARTS.map(function(x,i){return `<div class="row prt"><input placeholder="Nomi" value="${esc(x.n)}" oninput="PARTS[${i}].n=this.value"><input type="number" placeholder="Eni" value="${x.w}" oninput="PARTS[${i}].w=+this.value"><input type="number" placeholder="Bo‘yi" value="${x.h}" oninput="PARTS[${i}].h=+this.value"><input type="number" placeholder="Soni" value="${x.q}" oninput="PARTS[${i}].q=+this.value"><button class="btn g" onclick="PARTS.splice(${i},1);renderParts()">×</button></div>`}).join("")}
function addPart(){PARTS.push({n:"",w:100,h:100,q:1});renderParts()}
function pack(items,rolls,rot){
var list=[],best=null;items.forEach(function(it,ix){for(var k=0;k<it.q;k++)list.push({it:it,ix:ix})});
rolls.forEach(function(R){(rot?["s","l","g"]:["g"]).forEach(function(pol){
var ps=[],ok=true;
list.forEach(function(e){var w=e.it.w,h=e.it.h,c=pol=="g"?[w,h]:pol=="s"?[Math.min(w,h),Math.max(w,h)]:[Math.max(w,h),Math.min(w,h)];
if(c[0]>R&&rot&&c[1]<=R)c=[c[1],c[0]];
if(c[0]>R){ok=false;return}
ps.push({a:c[0],b:c[1],ix:e.ix,it:e.it})});
if(!ok)return;
ps.sort(function(x,y){return y.b-x.b||y.a-x.a});
var cols=[];
ps.forEach(function(q){var col=null;for(var i=0;i<cols.length;i++)if(cols[i].u+q.a<=R){col=cols[i];break}
if(!col){col={b:q.b,u:0,ps:[]};cols.push(col)}
q.y=col.u;col.u+=q.a;col.ps.push(q)});
var L=0;cols.forEach(function(c){c.x=L;L+=c.b});
if(!best||R*L<best.R*best.L||(R*L==best.R*best.L&&R<best.R))best={R:R,L:L,cols:cols}})});
return best}
function svg(r){var L=r.L,R=r.R,m=Math.max(L,R),fs=m/34,s=m/60;
var h=`<svg viewBox="0 0 ${L} ${R}" style="width:100%;max-height:300px;border-radius:8px;display:block" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="ht" width="${s}" height="${s}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="${s}" stroke="#888" stroke-opacity=".5" stroke-width="${s/4}"/></pattern></defs><rect width="${L}" height="${R}" fill="url(#ht)" stroke="#888" stroke-width="${s/6}"/>`;
r.cols.forEach(function(c){c.ps.forEach(function(q){var x=c.x,y=q.y;
h+=`<rect x="${x}" y="${y}" width="${q.b}" height="${q.a}" fill="${COL[q.ix%6]}" fill-opacity=".9" stroke="#fff" stroke-width="${s/5}"/>`;
var t=(q.it.n?q.it.n+" ":"")+q.it.w+"×"+q.it.h;
if(q.b>t.length*fs*.6&&q.a>fs*1.4)h+=`<text x="${x+q.b/2}" y="${y+q.a/2}" font-size="${fs}" fill="#fff" text-anchor="middle" dominant-baseline="middle" font-family="Manrope,sans-serif" font-weight="700">${esc(t)}</text>`})});
return h+"</svg>"}
function calc(){
var p=D[$("cp").value],t=p&&p.types[$("ct").value],o=$("out");o.classList.remove("hide");
if(!t){o.textContent="Mahsulot turini tanlang.";return}
var items=MODE==1?[{n:"",w:+$("cw").value,h:+$("ch").value,q:1}]:PARTS.map(function(x){return {n:x.n,w:+x.w,h:+x.h,q:Math.round(+x.q)}});
if(!items.length||items.some(function(x){return !(x.w>0&&x.h>0&&x.q>0)})){o.textContent="O‘lchamlarni to‘g‘ri kiriting (eni, bo‘yi va soni 0 dan katta).";return}
var real=0;items.forEach(function(x){real+=x.w*x.h*x.q/10000});
var dz=$("dz").value=="1",html;
if(p.mode=="direct"){html=`<div class="mu">Umumiy maydon: ${real.toFixed(2)} kv (to‘g‘ridan-to‘g‘ri kv bo‘yicha)</div><div class="mu" style="margin-top:8px">JAMI NARX</div><div class="big">${fmt(real*t.price)} so’m</div>`}
else{var r=pack(items,p.rolls,$("rot").checked);
if(!r){o.textContent="Bu o‘lchamlar bizdagi rulon enlariga sig‘maydi ("+p.rolls.join(", ")+" sm). Iltimos, biz bilan bog‘laning.";return}
var area=r.R*r.L/10000,waste=(1-real/area)*100;
html=svg(r)+`<div class="mu" style="margin-top:8px">Rulon eni: <b>${r.R} sm</b> · ishlatiladigan uzunlik: <b>${Math.round(r.L)} sm</b></div><div class="mu">Haqiqiy maydon: ${real.toFixed(2)} kv · Hisoblanadigan: ${area.toFixed(2)} kv · Chiqit: ${waste.toFixed(0)}%</div><div class="mu" style="margin-top:8px">JAMI NARX</div><div class="big">${fmt(area*t.price)} so’m</div>`}
o.innerHTML=html+(dz?dzNote():"")}
/* admin kirish */
async function h(s){try{var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}catch(e){return s}}
async function check(u,p){var x=null;try{x=JSON.parse(localStorage.getItem("mkauth"))}catch(e){}
if(x&&x.u)return u===x.u&&(await h(p))===x.p;return u==="admin"&&p==="maksadbek2002"}
function gate(){if(AUTH){renderAdm();return}
$("adm").innerHTML=`<div class="card login"><h2>Admin kirish</h2><label>Login</label><input id="lu" autocomplete="username"><label>Parol</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><button class="btn" onclick="doLogin()">Kirish</button><div id="le" class="err"></div></div>`}
async function doLogin(){if(await check($("lu").value.trim(),$("lp").value)){AUTH=true;try{sessionStorage.setItem("mks","1")}catch(e){}renderAdm()}else $("le").textContent="Login yoki parol noto‘g‘ri."}
function logout(){AUTH=false;try{sessionStorage.removeItem("mks")}catch(e){}gate()}
async function setAuth(){var u=$("nu").value.trim(),p=$("np").value;if(!u||p.length<6){$("ne").textContent="Login kiriting, parol kamida 6 belgi bo‘lsin.";return}
try{localStorage.setItem("mkauth",JSON.stringify({u:u,p:await h(p)}));$("ne").textContent="Saqlandi.";$("np").value=""}catch(e){$("ne").textContent="Saqlab bo‘lmadi."}}
/* admin panel */
function arr(k){return k=="D"?D:P}
function imgsHtml(k,i){return `<div class="gal">${arr(k)[i].imgs.map(function(s,j){return `<div><img src="${s}" alt=""><button class="btn g" onclick="delImg('${k}',${i},${j})">× o‘chirish</button></div>`}).join("")}</div><input type="file" accept="image/*" onchange="addImg('${k}',${i},this)">`}
function delImg(k,i,j){arr(k)[i].imgs.splice(j,1);save();renderAdm()}
function addImg(k,i,inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var q=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*q;c.height=im.height*q;c.getContext("2d").drawImage(im,0,0,c.width,c.height);arr(k)[i].imgs.push(c.toDataURL("image/jpeg",0.7));save();renderAdm()};im.src=r.result};r.readAsDataURL(f)}
function nameRow(k,i,p,d){return `<label>Nomi</label><div class="row"><input value="${esc(p.name)}" oninput="${k}[${i}].name=this.value;save()"><button class="btn g" onclick="${d}(${i})">O‘chirish</button></div><label>Tavsif</label><textarea oninput="${k}[${i}].desc=this.value;save()">${esc(p.desc)}</textarea><label>Rasmlar</label>${imgsHtml(k,i)}`}
function renderAdm(){
$("adm").innerHTML=`<div class="bar"><h2 style="margin:0">Admin panel</h2><button class="btn g" style="margin:0" onclick="logout()">Chiqish</button></div>
<h2>Tashqi reklama mahsulotlari</h2><div class="grid">`+D.map(function(p,i){
return `<div class="card">${nameRow("D",i,p,"delP")}<label>Hisoblash usuli</label><select onchange="D[${i}].mode=this.value;save();renderAdm()"><option value="roll"${p.mode!="direct"?" selected":""}>Rulon eni bo‘yicha</option><option value="direct"${p.mode=="direct"?" selected":""}>To‘g‘ridan-to‘g‘ri kv bo‘yicha</option></select>`+
(p.mode=="direct"?"":`<label>Rulon enlari (sm, vergul bilan)</label><input value="${p.rolls.join(", ")}" oninput="D[${i}].rolls=this.value.split(/[ ,;]+/).map(Number).filter(function(x){return x>0});save()">`)+
`<label>Turlari va 1 kv narxi (so‘m)</label>`+p.types.map(function(t,j){return `<div class="row"><input value="${esc(t.name)}" oninput="D[${i}].types[${j}].name=this.value;save()"><input type="number" value="${t.price}" oninput="D[${i}].types[${j}].price=+this.value;save()"><button class="btn g" onclick="D[${i}].types.splice(${j},1);save();renderAdm()">×</button></div>`}).join("")+
`<button class="btn g" onclick="D[${i}].types.push({name:'Yangi tur',price:0});save();renderAdm()">+ Tur qo‘shish</button></div>`}).join("")+`</div>
<button class="btn" onclick="D.push({name:'Yangi mahsulot',mode:'roll',rolls:[100],types:[{name:'Standart',price:0}],imgs:[],desc:''});save();renderAdm()">+ Yangi mahsulot</button>
<h2 style="margin-top:28px">Poligrafiya xizmatlari</h2><div class="grid">`+P.map(function(s,i){

s.options.map(function(o,j){return `<div class="row"><input value="${esc(o.name)}" oninput="P[${i}].options[${j}].name=this.value;save()"><input type="number" value="${o.price}" oninput="P[${i}].options[${j}].price=+this.value;save()"><button class="btn g" onclick="P[${i}].options.splice(${j},1);save();renderAdm()">×</button></div>`}).join("")+
`<button class="btn g" onclick="P[${i}].options.push({name:'Yangi tur',price:0});save();renderAdm()">+ Tur qo‘shish</button></div>`}).join("")+`</div>
<button class="btn" onclick="P.push({name:'Yangi xizmat',unit:'1 dona',desc:'',imgs:[],options:[{name:'Standart',price:0}]});save();renderAdm()">+ Yangi xizmat</button>
<div class="card" style="margin-top:28px;max-width:520px"><h2>Dizayn xizmati</h2><label>Boshlang‘ich narx (so‘m)</label><input type="number" value="${DS.from}" oninput="DS.from=+this.value;save()"><label>Qisqacha ma’lumot</label><textarea oninput="DS.info=this.value;save()">${esc(DS.info)}</textarea></div>
<div class="card" style="margin-top:16px;max-width:420px"><h2>Login va parolni almashtirish</h2><label>Yangi login</label><input id="nu"><label>Yangi parol</label><input id="np" type="password"><button class="btn" onclick="setAuth()">Saqlash</button><div id="ne" class="mu" style="margin-top:8px"></div></div>
<button class="btn g" onclick="resetD()">Hammasini boshlang‘ich holatga qaytarish</button>`}
